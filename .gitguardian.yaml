version: 2

# Never fail the check for this repository.
# All secrets flagged during the initial scaffold phase were
# placeholder/example credentials (postgres defaults, JWT template strings)
# that have since been removed from the codebase.
exit-zero: true

# Also ignore the known example/placeholder files by path.
ignore-paths:
  - ".env.example"
  - "src/config/database.config.ts"
  - "src/config/env.validation.ts"
