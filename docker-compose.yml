services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northstar-backend
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: northstar-postgres
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d northstar']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Reserved for future caching/session workloads.
    image: redis:7-alpine
    container_name: northstar-redis
    ports:
      - '6379:6379'

volumes:
  postgres_data:
